<style>
        body { font-family: 'Inter', sans-serif; }
    </style>

<body class="bg-surface text-on-surface h-screen w-screen overflow-hidden flex relative">
<!-- Dashboard Background (Dimmed) -->
<div class="absolute inset-0 z-0 flex flex-col pointer-events-none opacity-40">
<!-- Top App Bar Mock -->
<header class="bg-surface border-b border-outline-variant flex justify-between items-center h-16 px-gutter ml-[240px]">
<div class="font-headline-sm text-headline-sm font-bold text-primary">Academic Nexus</div>
<div class="flex gap-md">
<span class="material-symbols-outlined text-primary">settings</span>
<span class="material-symbols-outlined text-primary">account_circle</span>
</div>
</header>
<div class="flex flex-1 overflow-hidden">
<!-- Side Nav Mock -->
<nav class="bg-surface fixed left-0 top-0 h-full w-[240px] border-r border-outline-variant flex flex-col py-lg px-md">
<div class="mb-xl px-sm">
<div class="font-headline-md text-headline-md font-bold text-primary">Academic Nexus</div>
<div class="font-label-md text-label-md text-on-surface-variant mt-xs">Placement Cell</div>
</div>
<div class="flex flex-col gap-sm">
<div class="flex items-center gap-sm px-sm py-sm rounded-DEFAULT text-secondary font-bold border-r-4 border-secondary bg-surface-container-low">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-headline-sm text-headline-sm">Dashboard</span>
</div>
<div class="flex items-center gap-sm px-sm py-sm rounded-DEFAULT text-on-surface-variant">
<span class="material-symbols-outlined">business</span>
<span class="font-body-md text-body-md">Companies</span>
</div>
</div>
</nav>
<!-- Main Content Area Mock -->
<main class="ml-[240px] flex-1 p-xl">
<div class="font-headline-lg text-headline-lg mb-lg">Dashboard</div>
<div class="grid grid-cols-3 gap-lg">
<div class="bg-surface-container-low border border-outline-variant p-lg rounded-lg h-32"></div>
<div class="bg-surface-container-low border border-outline-variant p-lg rounded-lg h-32"></div>
<div class="bg-surface-container-low border border-outline-variant p-lg rounded-lg h-32"></div>
</div>
</main>
</div>
</div>
<!-- Modal Overlay -->
<div class="absolute inset-0 z-50 flex items-center justify-center bg-tertiary/40 backdrop-blur-sm p-md">
<!-- Modal Container -->
<div aria-labelledby="modal-title" aria-modal="true" class="bg-surface-container-low border border-outline-variant rounded-xl shadow-[0_4px_12px_rgba(94,94,94,0.08)] w-full max-w-md overflow-hidden flex flex-col" role="dialog">
<!-- Modal Header -->
<div class="px-lg py-md border-b border-outline-variant flex justify-between items-center bg-surface">
<h2 class="font-headline-md text-headline-md text-on-surface" id="modal-title">Assign Placement Cell</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-xs rounded-DEFAULT hover:bg-surface-container focus:outline-none focus:ring-2 focus:ring-secondary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-lg bg-surface">
<!-- Tab Toggle -->
<div class="flex rounded-DEFAULT p-xs bg-surface-container-highest mb-lg border border-outline-variant">
<button class="flex-1 py-sm font-label-md text-label-md rounded-DEFAULT bg-surface text-secondary shadow-[0_1px_2px_rgba(0,0,0,0.05)] transition-all text-center focus:outline-none focus:ring-2 focus:ring-secondary inset-ring">
                        Invite New User
                    </button>
<button class="flex-1 py-sm font-label-md text-label-md rounded-DEFAULT text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all text-center focus:outline-none focus:ring-2 focus:ring-secondary inset-ring">
                        Select Existing User
                    </button>
</div>
<!-- Form Content (Invite New User) -->
<form class="flex flex-col gap-md">
<!-- Name Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="invite-name">Name</label>
<input class="bg-surface-bright border border-outline rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all placeholder:text-on-surface-variant/50" id="invite-name" placeholder="e.g. Priya Sharma" type="text"/>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="invite-email">Email</label>
<input class="bg-surface-bright border border-outline rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all placeholder:text-on-surface-variant/50" id="invite-email" placeholder="priya@college.edu" type="email"/>
</div>
</form>
</div>
<!-- Modal Footer -->
<div class="px-lg py-md border-t border-outline-variant bg-surface flex justify-end gap-sm">
<button class="px-md py-sm rounded-DEFAULT border border-outline text-on-surface font-label-md text-label-md hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-secondary" type="button">
                    Cancel
                </button>
<button class="px-md py-sm rounded-DEFAULT bg-secondary text-on-secondary font-label-md text-label-md hover:bg-secondary-container hover:text-on-secondary-container transition-colors focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 focus:ring-offset-surface" type="button">
                    Send Invitation
                </button>
</div>
</div>
</div>
