<style>
        .input-base {
            @apply w-full border border-outline bg-surface-container-lowest rounded px-md py-sm font-body-md text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 outline-none transition-all duration-200 placeholder-on-surface-variant;
        }
        .label-base {
            @apply font-label-md text-label-md text-on-surface-variant mb-xs block uppercase;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen relative overflow-hidden">
<!-- Blurred Background Context (Companies List) -->
<div class="absolute inset-0 pointer-events-none opacity-40 blur-[2px] p-xl flex flex-col gap-lg z-0">
<div class="flex justify-between items-center w-[calc(100%-16rem)] ml-auto">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Companies</h1>
<button class="bg-primary text-on-primary rounded px-md py-sm font-label-md text-label-md">Add Company</button>
</div>
<div class="w-[calc(100%-16rem)] ml-auto bg-surface-container-low rounded border border-outline-variant p-lg">
<div class="h-12 bg-surface-container border-b border-outline-variant mb-4"></div>
<div class="h-16 bg-surface-container-lowest border-b border-outline-variant mb-2"></div>
<div class="h-16 bg-surface-container-lowest border-b border-outline-variant mb-2"></div>
<div class="h-16 bg-surface-container-lowest border-b border-outline-variant"></div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-primary/40 backdrop-blur-sm z-50 flex items-center justify-center p-md">
<!-- Modal Card -->
<div class="bg-surface-container-lowest rounded-lg w-full max-w-2xl border border-outline-variant shadow-lg flex flex-col max-h-[921px] overflow-hidden transform scale-100 transition-transform">
<!-- Header -->
<div class="px-xl py-lg border-b border-outline-variant flex justify-between items-center bg-surface-container-low">
<h2 class="font-headline-md text-headline-md text-on-surface m-0">Add Company</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Scrollable Content -->
<div class="px-xl py-lg overflow-y-auto">
<form class="flex flex-col gap-lg">
<!-- 2-Column Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-gutter gap-y-md">
<!-- Company Name -->
<div>
<label class="label-base" for="companyName">Company Name</label>
<input class="input-base" id="companyName" placeholder="Enter company name" type="text"/>
</div>
<!-- Industry -->
<div>
<label class="label-base" for="industry">Industry</label>
<div class="relative">
<select class="input-base appearance-none pr-xl" id="industry">
<option disabled="" selected="" value="">Select industry</option>
<option value="tech">Information Technology</option>
<option value="finance">Finance &amp; Banking</option>
<option value="consulting">Consulting</option>
<option value="manufacturing">Manufacturing</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- Website -->
<div>
<label class="label-base" for="website">Website</label>
<input class="input-base" id="website" placeholder="https://example.com" type="url"/>
</div>
<!-- Location -->
<div>
<label class="label-base" for="location">Location</label>
<input class="input-base" id="location" placeholder="City, State" type="text"/>
</div>
<!-- HR Contact Name -->
<div>
<label class="label-base" for="hrName">HR Contact Name</label>
<input class="input-base" id="hrName" placeholder="Full name" type="text"/>
</div>
<!-- HR Email -->
<div>
<label class="label-base" for="hrEmail">HR Email</label>
<input class="input-base" id="hrEmail" placeholder="email@company.com" type="email"/>
</div>
<!-- HR Phone -->
<div>
<label class="label-base" for="hrPhone">HR Phone</label>
<input class="input-base" id="hrPhone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<!-- Status -->
<div>
<label class="label-base" for="status">Status</label>
<div class="relative">
<select class="input-base appearance-none pr-xl" id="status">
<option value="lead">Lead</option>
<option value="active">Active</option>
<option value="blacklisted">Blacklisted</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Full Width Description -->
<div class="pt-sm">
<label class="label-base" for="description">Description (Optional)</label>
<textarea class="input-base resize-y" id="description" placeholder="Brief overview of the company..." rows="4"></textarea>
</div>
</form>
</div>
<!-- Footer -->
<div class="px-xl py-lg border-t border-outline-variant bg-surface-bright flex justify-end gap-md items-center">
<button class="px-md py-sm rounded border border-outline-variant text-on-surface font-label-md text-label-md hover:bg-surface-container transition-colors">
                    Cancel
                </button>
<button class="px-md py-sm rounded bg-secondary text-on-secondary font-label-md text-label-md hover:bg-secondary/90 transition-colors shadow-sm">
                    Add Company
                </button>
</div>
</div>
</div>
</body></html>
