name: CI

# This repository's default branch is `master`; there is no `main`. While
# these triggers named `main`, no run was ever queued — every lint,
# typecheck, test and build gate below had never executed on any commit or
# pull request. That is how a `vitest` major bump that stops the test runner
# from starting reached the default branch unnoticed.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # NON-BLOCKING, deliberately, and this is not a way of ignoring lint
      # findings — ESLint does not start at all on this repository:
      #
      #   Error: typescript-eslint does not support TS 7.0.
      #
      # eslint-config-next@16 loads typescript-eslint from every one of its
      # entry points, and no published version of typescript-eslint supports
      # TypeScript 7 (8.70.0, the newest, still declares
      # "typescript": ">=4.8.4 <6.1.0"; upstream: typescript-eslint#10940).
      # Upgrading cannot fix it, npm will not nest a peer dependency to give
      # the linter its own TS 6, and dropping typescript-eslint leaves no
      # TypeScript PARSER — a config composed without it silently linted 4
      # .mjs files and exited 0, which is a false green and worse than a
      # visible failure.
      #
      # Left in place and non-blocking so the failure stays visible on every
      # run instead of being deleted and forgotten. The three gates below are
      # blocking and are what actually protect the branch today.
      # REMOVE continue-on-error once typescript-eslint supports TS 7.
      - run: npm run lint
        continue-on-error: true
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest
