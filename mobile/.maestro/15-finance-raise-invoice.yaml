# Run with:
#   maestro test 15-finance-raise-invoice.yaml \
#     -e STUDENT_QUERY="jane" -e STUDENT_LABEL="ENR2026001 — Jane Doe"
# Assumes a seeded finance account already logged in, with a real student
# matching STUDENT_QUERY/STUDENT_LABEL in `students`. Verification that the
# row actually landed in `fees` happens in the companion Node script
# (service-role client), same discipline as every other Maestro flow.
appId: edu.academicnexus.app
---
- launchApp
- assertVisible:
    text: "Finance Dashboard"
    timeout: 15000
- tapOn: "Invoices"
- tapOn: "+ Raise Invoice"

- tapOn: "Search by name or enrollment number..."
- inputText: "${STUDENT_QUERY}"
- tapOn: "${STUDENT_LABEL}"

- tapOn: "e.g. Tuition, Hostel, Exam"
- inputText: "E2E Maestro Tuition"
- tapOn: "0.00"
- inputText: "5000"

- tapOn: "Raise Invoice"
- assertVisible:
    text: "Invoice raised successfully.*"
    timeout: 10000
