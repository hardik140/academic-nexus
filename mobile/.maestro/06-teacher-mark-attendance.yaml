# Run with: maestro test 06-teacher-mark-attendance.yaml -e COURSE_CODE="CS101"
# Assumes a seeded teacher account already logged in, with COURSE_CODE among
# their assigned courses and at least one enrolled student. Verification
# that the row actually landed in `attendance` happens in the companion
# Node script (service-role client), same discipline as 03/04.
appId: edu.academicnexus.app
---
- launchApp
- assertVisible:
    text: "Welcome,.*"
    timeout: 15000
- tapOn: "Attendance"
- tapOn: "${COURSE_CODE}"

# First student in the roster defaults to "present" — tap once to cycle it
# to "absent" so the save is a verifiable state change, not a no-op.
- tapOn:
    text: "present"
    index: 0
- assertVisible: "absent"
- tapOn: "Save Attendance"
- assertVisible:
    text: "Attendance saved successfully.*"
    timeout: 10000
